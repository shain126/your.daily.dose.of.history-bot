name: Generate daily draft

on:
  schedule:
    - cron: "30 0 * * *"    # 06:00 IST -> generate the day's draft (posts at 08:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-bot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate draft
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python bot.py --mode generate

      - name: Commit draft
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Add daily draft [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then echo "pushed"; exit 0; fi
            echo "push retry $i failed"; sleep 5
          done
          echo "push failed after retries"; exit 1
