name: Publish daily thread

on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST -> post the day's thread
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Publish thread
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE || 'true' }}
        run: python bot.py --mode publish

      - name: Commit status
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/
          git add used_topics.txt 2>/dev/null
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Mark thread posted [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then echo "pushed"; exit 0; fi
            echo "push retry $i failed"; sleep 5
          done
          echo "push failed after retries"; exit 1
